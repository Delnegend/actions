name: Dependency updates (reusable)

# Scheduled upgrade PRs with the 14-day publish quarantine. Every toolchain
# is opt-in: a caller names the ones it wants, and what it does not name is
# not touched. The label/PR flow is identical everywhere:
#
#   update:
#     uses: Delnegend/actions/.github/workflows/reusable-deps-update.yml@<sha>
#     with:
#       cargo: true
#       bun: true
#       bun-dir: frontend
#
# Frozen-blob repos (no manifest to upgrade) name neither, and get the same
# daily no-op check plus Dependabot coverage.

on:
  workflow_call:
    inputs:
      cargo:
        description: Run cargo update behind the registry cooldown.
        type: boolean
        default: false
      bun:
        description: Run bun update behind the bunfig.toml cooldown.
        type: boolean
        default: false
      bun-dir:
        description: Directory holding package.json/bunfig.toml.
        type: string
        default: "."
      bun-version:
        description: Bun version for setup-bun.
        type: string
        default: latest

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deps-main
  cancel-in-progress: false

jobs:
  update:
    name: Upgrade dependencies
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: inputs.cargo

      # Self-reference by moving tag: this file ships with the action, so it
      # always wants the current cargo-cooldown, not a pinned copy of itself.
      - uses: Delnegend/actions/cargo-cooldown@v1
        id: cargo-cooldown
        if: inputs.cargo

      - name: Upgrade Cargo dependencies (cooldown in .cargo/config.toml)
        if: inputs.cargo && steps.cargo-cooldown.outputs.enforced == 'true'
        run: cargo update

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: inputs.bun
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Upgrade Bun dependencies (cooldown in bunfig.toml)
        if: inputs.bun
        working-directory: ${{ inputs.bun-dir }}
        run: bun update

      - name: Detect whether anything changed
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure the dependencies label exists
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create dependencies --force --color 0366d6 --description "Dependency updates"

      - name: Open upgrade PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B deps/automatic
          git add -u
          git commit -m "chore(deps): upgrade dependencies"
          git push --force origin deps/automatic
          if gh pr view deps/automatic --json number >/dev/null 2>&1; then
            echo "the push updated the existing upgrade PR"
          else
            gh pr create --base main --head deps/automatic \
              --label dependencies \
              --title "chore(deps): upgrade dependencies" \
              --body "Automated daily upgrade. Versions published less than 14 days ago were filtered out by the package manager."
          fi
