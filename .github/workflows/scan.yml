name: Scan

# Reusable scan bundle. Consumers call it as a job and get every scan back as
# its own status check, running in parallel on separate runners — a composite
# action could not do that, since its steps share one runner and so would
# serialise.
#
#   scan:
#     uses: Delnegend/actions/.github/workflows/scan.yml@<sha>
#     permissions:
#       contents: read
#
# All scans run by default. Opt out with `exclude` (space-separated). The old
# `scans` whitelist still works and intersects with `exclude`.
#
#   scan:
#     uses: Delnegend/actions/.github/workflows/scan.yml@<sha>
#     with:
#       exclude: osv

on:
  workflow_call:
    inputs:
      scans:
        description: >-
          Legacy whitelist of scans to run, from gitleaks, actionlint,
          semgrep, trivy and osv. Prefer `exclude`: omitting `scans` runs
          everything not excluded.
        type: string
        default: gitleaks actionlint semgrep trivy osv
      exclude:
        description: >-
          Space-separated scans to skip, e.g. "osv" for a project with no
          lockfile. Intersects with `scans`.
        type: string
        default: ""
      trivy-scanners:
        description: >-
          Scanners Trivy runs. Empty means Trivy's own default, which is
          vuln,secret and excludes misconfiguration.
        type: string
        default: vuln,misconfig
      osv-config:
        description: >-
          OSV-Scanner config file at the repository root, for a project that
          quarantines an advisory the daily upgrade cannot yet fix.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      scans:
        description: Scans to run.
        type: string
        default: gitleaks actionlint semgrep trivy osv
      exclude:
        description: Space-separated scans to skip.
        type: string
        default: ""
      trivy-scanners:
        description: Scanners Trivy runs.
        type: string
        default: vuln,misconfig
      osv-config:
        description: OSV-Scanner config file at the repository root.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    if: contains(inputs.scans, 'gitleaks') && !contains(inputs.exclude, 'gitleaks')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: a leaked secret lives in a past commit, not in
          # the tree at HEAD.
          fetch-depth: 0
      - name: Run Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/path" ghcr.io/gitleaks/gitleaks:latest detect --source=/path --verbose

  actionlint:
    name: Workflow lint (actionlint)
    if: contains(inputs.scans, 'actionlint') && !contains(inputs.exclude, 'actionlint')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned, unlike the scans below which float on :latest. actionlint gains
      # checks between releases, so a floating tag can fail an unrelated commit
      # when a new rule lands.
      - name: Run actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo rhysd/actionlint:1.7.12

  semgrep:
    name: SAST (Semgrep)
    if: contains(inputs.scans, 'semgrep') && !contains(inputs.exclude, 'semgrep')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Semgrep
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/src" returntocorp/semgrep semgrep scan --config=auto --error

  trivy:
    name: Misconfig & Vulns (Trivy)
    if: contains(inputs.scans, 'trivy') && !contains(inputs.exclude, 'trivy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `-w /src` matters: Trivy reads .trivyignore from its working
      # directory, not from the scan target, so a project with one only gets it
      # applied when Trivy runs from inside the tree. Harmless otherwise.
      - name: Run Trivy
        run: >-
          docker run --rm -w /src -v "${GITHUB_WORKSPACE}:/src" aquasec/trivy fs /src
          --severity HIGH,CRITICAL
          ${{ inputs.trivy-scanners && format('--scanners {0}', inputs.trivy-scanners) || '' }}
          --exit-code 1

  osv:
    name: Dependencies (OSV-Scanner)
    if: contains(inputs.scans, 'osv') && !contains(inputs.exclude, 'osv')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No lockfile, nothing to scan: skip loudly instead of failing on an
      # empty tree. Lets lockfile-less repos call this workflow with no `with:`.
      - name: Look for a lockfile
        id: lockfile
        run: |
          if git ls-files | grep -qE '^(Cargo\.lock|package-lock\.json|bun\.lock|bun\.lockb|pnpm-lock\.yaml|yarn\.lock|go\.mod|Gemfile\.lock|requirements.*\.txt|poetry\.lock|Pipfile\.lock|composer\.lock)$'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no lockfile tracked, skipping OSV-Scanner"
          fi
      - name: Run OSV-Scanner
        if: steps.lockfile.outputs.found == 'true'
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" ghcr.io/google/osv-scanner:latest
          ${{ inputs.osv-config && format('--config=/src/{0}', inputs.osv-config) || '' }}
          --recursive /src