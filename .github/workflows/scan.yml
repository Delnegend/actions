name: Scan

# Reusable security scan bundle. Call as a job; opt out via 'exclude'.

on:
  workflow_call:
    inputs:
      exclude:
        description: Space-separated scans to skip.
        type: string
        default: ""
      ref:
        description: Ref to check out.
        type: string
        default: ""
      forgejo:
        description: True to clone from Forgejo (twin repos) using secrets.forgejo_token.
        type: boolean
        default: false
    secrets:
      forgejo_token:
        description: Token for private Forgejo checkout (twin repos).
        required: false
  workflow_dispatch:
    inputs:
      exclude:
        description: Space-separated scans to skip.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  config-policy:
    name: Rust and Bun configuration policy
    if: "!contains(inputs.exclude, 'config-policy')"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
          path: source
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false
      - name: Check workflow revision
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::Reusable workflow repository or revision is missing"
            exit 1
          fi
      - name: Checkout configuration tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: config-policy-tools
          persist-credentials: false
      - name: Check Rust and Bun configuration
        uses: ./config-policy-tools/common-configs
        with:
          path: source

  gitleaks:
    name: Secret Scanning (Gitleaks)
    if: "!contains(inputs.exclude, 'gitleaks')"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Run Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/path" ghcr.io/gitleaks/gitleaks:latest detect --source=/path --verbose

  actionlint:
    name: Workflow lint (actionlint)
    if: "!contains(inputs.exclude, 'actionlint')"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      # Pinned to prevent upstream rule additions failing unrelated commits.
      - name: Run actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo rhysd/actionlint:1.7.12

  semgrep:
    name: SAST (Semgrep)
    if: "!contains(inputs.exclude, 'semgrep')"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Run Semgrep
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/src" returntocorp/semgrep semgrep scan --config=auto --error

  trivy:
    name: Misconfig, Vulns & Secrets (Trivy)
    if: "!contains(inputs.exclude, 'trivy')"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      # `-w /src` matters: Trivy reads .trivyignore from its working
      # directory, not from the scan target, so a project with one only gets it
      # applied when Trivy runs from inside the tree. Harmless otherwise.
      # Fixed scanner set: vuln + misconfig + secret. No caller needed a
      # narrower set; per-repo knobs only hid signal.
      - name: Run Trivy
        run: >-
          docker run --rm -w /src -v "${GITHUB_WORKSPACE}:/src" aquasec/trivy fs /src
          --severity HIGH,CRITICAL --scanners vuln,misconfig,secret
          --exit-code 1

  osv:
    name: Dependencies (OSV-Scanner)
    if: "!contains(inputs.exclude, 'osv')"
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      # No lockfile, nothing to scan: skip loudly instead of failing on an
      # empty tree. Lets lockfile-less repos call this workflow with no `with:`.
      - name: Look for a lockfile
        id: lockfile
        run: |
          if git ls-files | grep -qE '^(Cargo\.lock|package-lock\.json|bun\.lock|bun\.lockb|pnpm-lock\.yaml|yarn\.lock|go\.mod|Gemfile\.lock|requirements.*\.txt|poetry\.lock|Pipfile\.lock|composer\.lock)$'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no lockfile tracked, skipping OSV-Scanner"
          fi
      # A quarantine file at the repo root is picked up automatically. It
      # exists for advisories the daily upgrade cannot fix yet; each entry
      # carries its own review date. No input needed.
      - name: Look for an OSV quarantine config
        id: osv-config
        run: |
          if [ -f osv-scanner.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "using osv-scanner.toml quarantine config"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run OSV-Scanner
        if: steps.lockfile.outputs.found == 'true'
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" ghcr.io/google/osv-scanner:latest
          ${{ steps.osv-config.outputs.found == 'true' && '--config=/src/osv-scanner.toml' || '' }}
          --recursive /src

  emdash:
    name: Check em dashes
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Search for em dashes
        run: |
          if git grep -n -I $'\u2014'; then
            echo "::error::Em dashes (—) found in tracked files. Use hyphens, colons, or parentheses instead."
            exit 1
          fi

  facade:
    name: README and license (common-facade)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Check README and licenses
        uses: Delnegend/common-facade@0d02d2da750c1a7c6e0fe5e5eae7910d07dfcc64 # main

  docs-references:
    name: Documentation references
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        if: inputs.forgejo
        uses: Delnegend/actions/twin-checkout@main  # nosemgrep
        with:
          token: ${{ secrets.forgejo_token }}
          ref: ${{ inputs.ref }}
      - name: Checkout repository
        if: "!inputs.forgejo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Check documentation references
        shell: bash
        run: |
          missing=0
          while IFS= read -r -d '' file; do
            if ! grep -Fq -- "$file" README.md; then
              echo "::error file=README.md::Missing reference to $file"
              missing=1
            fi
          done < <(if [ -d docs ]; then find docs -type f -name '*.md' -print0; fi)
          exit "$missing"