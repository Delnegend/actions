name: cargo-cooldown
description: >-
  Check that the installed Cargo enforces the 14-day publish quarantine
  (`registry.global-min-publish-age`, stable from Cargo 1.100). Older
  toolchains ignore the key silently, so upgrading with one would pull
  versions with no quarantine at all.

outputs:
  enforced:
    description: "'true' when cargo update is safe to run."
    value: ${{ steps.gate.outputs.enforced }}

runs:
  using: composite
  steps:
    - name: Check that Cargo can enforce the cooldown
      id: gate
      shell: bash
      run: |
        set -euo pipefail
        # Skip if Cargo < 1.100 (registry.global-min-publish-age unsupported).
        version="$(cargo --version | awk '{print $2}')"
        major="${version%%.*}"
        minor="${version#*.}"; minor="${minor%%.*}"
        if [ "$major" -eq 1 ] && [ "$minor" -lt 100 ]; then
          echo "enforced=false" >> "$GITHUB_OUTPUT"
          echo "::warning::cargo ${version} ignores registry.global-min-publish-age (stable from 1.100) — no Cargo upgrade was made, so nothing lands without the 14-day quarantine"
        else
          echo "enforced=true" >> "$GITHUB_OUTPUT"
        fi
