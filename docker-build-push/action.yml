name: docker-build-push
description: >-
  Build a container image with Buildx and push it (or load it locally for
  test-builds). Exactly two tags, never rolling ones; zstd-compressed layers
  on publish; registry layer cache shared across runs. Repo-specific staging
  (example configs) and post-build asserts stay in the caller.

inputs:
  image:
    description: Fully qualified image name, e.g. ghcr.io/delnegend/hath.
    required: true
  version:
    description: Version tag, without the v prefix.
    required: true
  publish:
    description: "'true' pushes to the registry; otherwise the image loads locally."
    required: false
    default: "false"
  target:
    description: >-
      Build stage. Empty builds the default (last) stage. The only stage
      in use is `server` (l4d2); keep other repos stageless.
    required: false
    default: ""
  build-args:
    description: Newline-separated KEY=VALUE build arguments.
    required: false
    default: ""

outputs:
  digest:
    description: Image digest of the build.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to GitHub Container Registry
      if: inputs.publish == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Exactly two tags, never rolling ones, so a version always means the same
    # image. Test builds load locally instead of pushing. Single platform:
    # every image in the fleet is linux/amd64, and the registry cache is
    # shared across runs rather than scoped to one workflow's cache.
    - name: Build and push image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: Dockerfile
        target: ${{ inputs.target }}
        platforms: linux/amd64
        push: ${{ inputs.publish == 'true' }}
        load: ${{ inputs.publish != 'true' }}
        outputs: ${{ inputs.publish == 'true' && 'type=image,compression=zstd,compression-level=4' || '' }}
        build-args: ${{ inputs.build-args }}
        tags: |
          ${{ inputs.image }}:${{ inputs.version }}
          ${{ inputs.image }}:latest
        labels: |
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=registry,ref=${{ inputs.image }}:buildcache
        cache-to: type=registry,ref=${{ inputs.image }}:buildcache,mode=max,image-manifest=true
