name: package-artifact
description: >-
  Stage, archive and upload one build artifact. The caller supplies only what
  is unique to their build: the binary, the version and the target triple.
  Format, compression effort, directory layout and the archive name are
  decided here — zip at maximum effort on Windows, tar.xz at maximum effort
  everywhere else, one top-level directory, and the executable bit recorded
  inside the archive.

inputs:
  source:
    description: Path to a file or directory to package.
    required: false
    default: ""
  extra:
    description: Optional space-separated additional paths to include.
    required: false
    default: ""
  name:
    description: Artifact base name, e.g. rsrpc.
    required: true
  version:
    description: >-
      Version being released. A leading v is dropped, so v0.29.0 and 0.29.0
      produce the same archive name.
    required: true
  target:
    description: Platform slug, e.g. x86_64-unknown-linux-gnu.
    required: true
  output-dir:
    description: Directory to write the archive into.
    required: false
    default: "dist"
  upload:
    description: Whether to upload the archive to the Actions run.
    required: false
    default: "true"

outputs:
  archive:
    description: Archive file name.
    value: ${{ steps.package.outputs.archive }}
  path:
    description: Path to the archive, relative to the workspace.
    value: ${{ steps.package.outputs.path }}
  stem:
    description: The `<name>-<version>-<target>` stem the archive is named from.
    value: ${{ steps.package.outputs.stem }}

runs:
  using: composite
  steps:
    - id: package
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        EXTRA: ${{ inputs.extra }}
        NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
        TARGET: ${{ inputs.target }}
        OUTDIR: ${{ inputs.output-dir }}
        RUNNER_OS: ${{ runner.os }}
      run: python3 "$GITHUB_ACTION_PATH/package-artifact.py"

    # The archive is uploaded under its final release name, so the Actions run
    # and the release show the same string a consumer will fetch.
    #
    # `uses:` takes a literal, never an expression, so the ref is pinned here
    # rather than passed in. That is the better arrangement anyway: the pin
    # lands once in one place instead of in every consumer.
    - name: Upload archive
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ steps.package.outputs.stem }}
        path: ${{ steps.package.outputs.path }}
        if-no-files-found: error