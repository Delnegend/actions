name: publish-release
description: >-
  Finish a release workflow: optionally collect the consolidated build
  artifacts, then publish (or stage) the GitHub release. The matrix layout
  and per-target packaging stay in the caller; this only finishes the job.
  The release body is generated here, never written by hand in a caller:
  a container image gets a pull snippet, a binary release gets the
  auto-generated notes.

inputs:
  ref:
    description: Tag (or SHA for a test-build) the build jobs checked out.
    required: true
  publish:
    description: "'true' creates the GitHub release."
    required: false
    default: "false"
  download:
    description: "'true' downloads run artifacts first (binary releases)."
    required: false
    default: "true"
  files:
    description: Release asset glob, relative to the workspace.
    required: false
    default: "artifacts/**/*"
  image:
    description: >-
      Fully qualified image name for a container release, e.g.
      ghcr.io/delnegend/hath. Empty means a binary release, whose body is
      the auto-generated notes alone.
    required: false
    default: ""
  version:
    description: >-
      Version tag without the v prefix, for the container pull snippet.
      Required when `image` is set, ignored otherwise.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download all artifacts
      if: inputs.download == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        path: artifacts
        # Flatten matrix artifact uploads into single directory.
        merge-multiple: true

    # Generate release notes body.
    - name: Render release body
      id: body
      if: inputs.publish == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        if [ -n "$IMAGE" ]; then
          [ -n "$VERSION" ] || { echo "::error::publish-release: version is required with image" >&2; exit 1; }
          {
            echo "Container image:"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Or \`latest\` for the most recent release. The git tag \`$REF\`"
            echo "is the same image, named the way git wants it."
          } > "$RUNNER_TEMP/release-body.md"
          echo "path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish Consolidated Release
      if: inputs.publish == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        tag_name: ${{ inputs.ref }}
        name: ${{ inputs.ref }}
        generate_release_notes: true
        body_path: ${{ steps.body.outputs.path }}
        files: ${{ inputs.files }}
