name: resolve-release
description: >-
  Decide what a release run should do, then do it. Validates the dispatch ref,
  guards against shipping code the CI gate did not see, bumps the version,
  commits, tags and pushes, and reports ref/version/publish/skip for the build
  job. Handles four dispatch modes: ship a new version, test-build a commit,
  rebuild an existing tag, or preview without mutating.

inputs:
  ref:
    description: >-
      Dispatch ref. Empty = ship a new version. A commit SHA (7-64 hex) =
      test-build it without publishing. A version tag (vX.Y.Z) = rebuild it.
    required: false
    default: ""
  dry-run:
    description: "Preview only: report what would happen, never mutate."
    required: false
    default: "false"
  gate-sha:
    description: >-
      Commit the CI gate approved. Shipping refuses if HEAD has moved past it,
      so an ungated commit is never released. Ignored for ref-dispatch, which
      pins its own commit.
    required: false
    default: ""
  manifest-path:
    description: >-
      Manifest whose version is the source of truth, used to recover a run that
      pushed its bump commit but died before tagging. Empty disables recovery.
    required: false
    default: Cargo.toml
  bump-command:
    description: >-
      Command that rewrites the version files; the new version is passed as its
      first argument. Empty for a manifest-less project, where the version lives
      in the git tag alone and HEAD is tagged without a commit.
    required: false
    default: just bump
  semver-bump:
    description: "Bump type from ietf-tools/semver-action."
    required: false
    default: ""
  semver-current:
    description: "Current version from ietf-tools/semver-action."
    required: false
    default: ""
  semver-next:
    description: "Next version (with v prefix) from ietf-tools/semver-action."
    required: false
    default: ""
  semver-next-strict:
    description: "Next version (no v prefix) from ietf-tools/semver-action."
    required: false
    default: ""

outputs:
  ref:
    description: "Git ref the build job should check out: a tag or a commit SHA."
    value: ${{ steps.resolve.outputs.ref }}
  version:
    description: "Version being released, without the v prefix."
    value: ${{ steps.resolve.outputs.version }}
  publish:
    description: "'true' when this run should create a release."
    value: ${{ steps.resolve.outputs.publish }}
  skip:
    description: "'true' when there is nothing to build."
    value: ${{ steps.resolve.outputs.skip }}

runs:
  using: composite
  steps:
    - name: Resolve
      id: resolve
      shell: bash
      env:
        INPUT_REF: ${{ inputs.ref }}
        DRY_RUN: ${{ inputs.dry-run }}
        GATE_SHA: ${{ inputs.gate-sha }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        BUMP_COMMAND: ${{ inputs.bump-command }}
        BUMP: ${{ inputs.semver-bump }}
        CURRENT: ${{ inputs.semver-current }}
        NEXT: ${{ inputs.semver-next }}
        NEXT_STRICT: ${{ inputs.semver-next-strict }}
      run: |
        set -euo pipefail

        emit() { # ref version publish skip
          {
            echo "ref=$1"
            echo "version=$2"
            echo "publish=$3"
            echo "skip=$4"
          } >> "$GITHUB_OUTPUT"
        }
        skip_only() {
          echo "$1"
          emit "" "" "false" "true"
          exit 0
        }

        # Dispatch values are validated before anything is mutated, so a typo
        # fails the run instead of silently doing nothing.
        if [ -n "$INPUT_REF" ]; then
          if echo "$INPUT_REF" | grep -qE '^[0-9a-f]{7,64}$'; then
            KIND=sha
          elif echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            KIND=tag
          else
            echo "::error::ref must be empty, a commit SHA (7-64 hex), or a version tag (vX.Y.Z); got '$INPUT_REF'."
            exit 1
          fi
        else
          KIND=ship
        fi

        # A preview must never mutate, on any path.
        if [ "$DRY_RUN" = "true" ]; then
          case "$KIND" in
            sha) skip_only "[dry-run] would test-build commit $INPUT_REF (no publish)" ;;
            tag) skip_only "[dry-run] would rebuild tag $INPUT_REF and publish it" ;;
            *)   skip_only "[dry-run] would bump to $NEXT_STRICT, tag $NEXT, push, build, and publish" ;;
          esac
        fi

        # Ref dispatch pins its own commit, so the gate check does not apply.
        if [ "$KIND" = "ship" ]; then
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -n "$GATE_SHA" ] && [ "$HEAD_SHA" != "$GATE_SHA" ]; then
            echo "::error::main moved during the gate ($GATE_SHA -> $HEAD_SHA); re-run to gate the new HEAD."
            exit 1
          fi
        fi

        if [ "$KIND" = "sha" ]; then
          echo "Test build against commit $INPUT_REF (will not publish)."
          emit "$INPUT_REF" "$INPUT_REF" "false" "false"
          exit 0
        fi

        if [ "$KIND" = "tag" ]; then
          git rev-parse -q --verify "refs/tags/$INPUT_REF" >/dev/null \
            || { echo "::error::tag $INPUT_REF does not exist."; exit 1; }
          echo "Rebuilding existing tag $INPUT_REF."
          emit "$INPUT_REF" "${INPUT_REF#v}" "true" "false"
          exit 0
        fi

        LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"

        # Recovery: an earlier run pushed its bump commit then died before
        # tagging. Such a commit is not conventional, so the next run sees no
        # releasable work — but the manifest is ahead of the latest tag, so the
        # tag is what's missing.
        if [ -n "$MANIFEST_PATH" ] && [ -n "$LATEST_TAG" ]; then
          MANIFEST_VER="$(grep -m1 '^version = ' "$MANIFEST_PATH" | cut -d'"' -f2 || true)"
          if [ -n "$MANIFEST_VER" ] && [ "v$MANIFEST_VER" != "$LATEST_TAG" ] \
             && [ "$(printf '%s\n%s\n' "v$MANIFEST_VER" "$LATEST_TAG" | sort -V | head -n1)" = "$LATEST_TAG" ]; then
            echo "Manifest ($MANIFEST_VER) is ahead of latest tag ($LATEST_TAG); tagging the stranded commit."
            git config user.name "github-actions[bot]"
            git config user.email "actions@users.noreply.github.com"
            TAG="v$MANIFEST_VER"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            emit "$TAG" "$MANIFEST_VER" "true" "false"
            exit 0
          fi
        fi

        # Nothing releasable since the last tag. NEXT is the signal: when there
        # are no new commits at all the semver action returns before setting
        # `bump`, so BUMP is empty rather than "none".
        if [ -z "$NEXT" ] || [ "$BUMP" = "none" ]; then
          skip_only "No version bump needed (current: ${CURRENT:-none})."
        fi

        # Refuse to publish a version that is not ahead of the latest tag.
        if [ -n "$LATEST_TAG" ]; then
          if [ "$NEXT" = "$LATEST_TAG" ] \
             || [ "$(printf '%s\n%s\n' "$NEXT" "$LATEST_TAG" | sort -V | head -n1)" = "$NEXT" ]; then
            echo "::error::Calculated $NEXT is not ahead of latest tag $LATEST_TAG; nothing new to ship."
            exit 1
          fi
        fi

        git config user.name "github-actions[bot]"
        git config user.email "actions@users.noreply.github.com"

        if [ -n "$BUMP_COMMAND" ]; then
          # Intentionally unquoted: the command may be two words ("just bump").
          # shellcheck disable=SC2086
          $BUMP_COMMAND "$NEXT_STRICT"
          git add -u
          git diff --staged --quiet && { echo "::error::bump produced no change in package files"; exit 1; }
          git commit -m "chore(release): ${NEXT}"
          # Commit first: a failed tag push is recoverable from the manifest,
          # a lost commit is not.
          git push origin HEAD:main
          git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null \
            && { echo "::error::tag ${NEXT} already exists"; exit 1; }
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"
        else
          # Manifest-less project: the tag is the version, so HEAD is tagged
          # directly and nothing is committed.
          echo "No bump command; tagging HEAD as ${NEXT}."
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"
        fi

        emit "$NEXT" "$NEXT_STRICT" "true" "false"