name: resolve-release
description: >-
  Decide what a release run should do, then do it. Validates the dispatch ref,
  guards against shipping code the CI gate did not see, bumps the version,
  commits, tags and pushes, and reports ref/version/publish/skip for the build
  job. Handles four dispatch modes: ship a new version, test-build a commit,
  rebuild an existing tag, or preview without mutating.

inputs:
  ref:
    description: >-
      Dispatch ref. Empty = ship a new version. A commit SHA (7-64 hex) =
      test-build it without publishing. A version tag (vX.Y.Z) = rebuild it.
    required: false
    default: ""
  dry-run:
    description: "Preview only: report what would happen, never mutate."
    required: false
    default: "false"
  gate-sha:
    description: >-
      Commit the CI gate approved. Shipping refuses if HEAD has moved past it,
      so an ungated commit is never released. Ignored for ref-dispatch, which
      pins its own commit.
    required: false
    default: ""
  manifest-path:
    description: >-
      Manifest whose version is the source of truth, used to recover a run that
      pushed its bump commit but died before tagging. Empty disables recovery.
    required: false
    default: Cargo.toml
  bump-command:
    description: >-
      Command that rewrites the version files; the new version is passed as its
      first argument. Empty for a manifest-less project, where the version lives
      in the git tag alone and HEAD is tagged without a commit.
    required: false
    default: just bump
  semver-bump:
    description: "Bump type from ietf-tools/semver-action."
    required: false
    default: ""
  semver-current:
    description: "Current version from ietf-tools/semver-action."
    required: false
    default: ""
  semver-next:
    description: "Next version (with v prefix) from ietf-tools/semver-action."
    required: false
    default: ""
  semver-next-strict:
    description: "Next version (no v prefix) from ietf-tools/semver-action."
    required: false
    default: ""

outputs:
  ref:
    description: "Git ref the build job should check out: a tag or a commit SHA."
    value: ${{ steps.resolve.outputs.ref }}
  version:
    description: "Version being released, without the v prefix."
    value: ${{ steps.resolve.outputs.version }}
  publish:
    description: "'true' when this run should create a release."
    value: ${{ steps.resolve.outputs.publish }}
  skip:
    description: "'true' when there is nothing to build."
    value: ${{ steps.resolve.outputs.skip }}

runs:
  using: composite
  steps:
    - name: Resolve
      id: resolve
      shell: bash
      env:
        INPUT_REF: ${{ inputs.ref }}
        DRY_RUN: ${{ inputs.dry-run }}
        GATE_SHA: ${{ inputs.gate-sha }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        BUMP_COMMAND: ${{ inputs.bump-command }}
        BUMP: ${{ inputs.semver-bump }}
        CURRENT: ${{ inputs.semver-current }}
        NEXT: ${{ inputs.semver-next }}
        NEXT_STRICT: ${{ inputs.semver-next-strict }}
      run: python3 "$GITHUB_ACTION_PATH/resolve-release.py"
